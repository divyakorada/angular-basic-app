<div class="d-flex flex-row  justify-content-center">
<div class="card" style="padding: 20px; margin: 20px;">
    <form #userform="ngForm" (ngSubmit)="userForm(userform)">
        <div class="mb-3">
            <label class="me-3">UserName:</label>
            <input type="text" name="userName" [(ngModel)]="user.Username" #userName="ngModel" required minlength="3"/>
            <div *ngIf="userName?.invalid && userName?.touched">
                <small class="text-danger" *ngIf="userName?.errors?.required">Name is required</small>
                <small class="text-danger" *ngIf="userName?.errors?.minlength">Name must be at least 3 characters</small>
              </div>
        </div>
        <div class="mb-3">
            <label class="me-3">Password:</label>
            <input type="text" name="Password" [(ngModel)]="user.password" #Password="ngModel" required minlength="6"/>
            <div *ngIf="Password?.invalid && Password?.touched">
                <small class="text-danger" *ngIf="Password?.errors?.required">Password is required</small>
                <small class="text-danger" *ngIf="Password?.errors?.minlength">Password must be at least 6 characters</small>
              </div>
        </div>
        <div class="d-grid gap-2">
        <button type="submit"  class="btn btn-primary" [disabled]="!userform.valid">Submit</button>
    </div>

    </form>
</div>

<div class="card" style="padding: 20px; margin: 20px;">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="me-3">UserName:</label>
            <input type="text" formControlName="uname"/>
            <div>
                <span class="text-danger"  *ngIf="loginForm.controls.uname.touched && loginForm.controls.uname.errors?.required">
                    Name is required
                </span>
                <span class="text-danger" *ngIf="loginForm.controls.uname.touched && loginForm.controls.uname.errors?.minlength">
                    Name must be 3 length character
                </span>
            </div>
        </div>
        <div class="mb-3">
            <label class="me-3">Password:</label>
            <input type="text" formControlName="pwd"/>
            <div>
                <span class="text-danger" *ngIf="loginForm.controls.pwd.touched && loginForm.controls.pwd.errors?.required">
                    Password is required
                </span>
                <span class="text-danger" *ngIf="loginForm.controls.pwd.touched && loginForm.controls.pwd.errors?.minlength">
                    Password must be 6 length character
                </span>
            </div>
        </div>
        <div class="d-grid gap-2">
        <button type="submit"  class="btn btn-primary" [disabled]="loginForm.invalid">Submit</button>
    </div>

    </form>
</div>
</div>
